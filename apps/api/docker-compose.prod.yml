# Production-like local stack. Create a gitignored .env.prod with URL-safe
# secrets (for example, `openssl rand -hex 32`) before running Compose.
name: networkpeer-prod

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  PORT: "3000"
  API_PREFIX: /api/v1
  # This exception is limited in config.ts to the private Docker hostnames
  # below. Keep it false for Railway, Render, and other managed services.
  ALLOW_INSECURE_INTERNAL_TRANSPORT: "true"
  DATABASE_URL: postgresql://networkpeer_app:${NETWORKPEER_APP_DB_PASSWORD:?NETWORKPEER_APP_DB_PASSWORD must be set}@postgres:5432/networkpeer
  DATABASE_ADMIN_URL: postgresql://networkpeer_admin_api:${NETWORKPEER_ADMIN_DB_PASSWORD:?NETWORKPEER_ADMIN_DB_PASSWORD must be set}@postgres:5432/networkpeer
  DATABASE_MEDIA_VERIFIER_URL: postgresql://networkpeer_media_verifier:${NETWORKPEER_MEDIA_DB_PASSWORD:?NETWORKPEER_MEDIA_DB_PASSWORD must be set}@postgres:5432/networkpeer
  DATABASE_FINANCIAL_URL: postgresql://networkpeer_financial_api:${NETWORKPEER_FINANCIAL_DB_PASSWORD:?NETWORKPEER_FINANCIAL_DB_PASSWORD must be set}@postgres:5432/networkpeer
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 7d
  JWT_ISSUER: networkpeer-api
  JWT_AUDIENCE: networkpeer-mobile
  OTP_ECHO_IN_RESPONSE: "false"
  SMS_PROVIDER: twilio
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?TWILIO_ACCOUNT_SID must be set}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?TWILIO_AUTH_TOKEN must be set}
  TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:?TWILIO_FROM_NUMBER must be set}
  AWS_REGION: ${AWS_REGION:?AWS_REGION must be set}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID must be set}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY must be set}
  AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
  AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET must be set}
  PAYMENT_GATEWAY: stripe
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET must be set}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY must be set}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET must be set}
  STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID:?STRIPE_CONNECT_CLIENT_ID must be set}
  PAYMENT_DISPATCH_ENABLED: "true"
  PUSH_NOTIFICATIONS_ENABLED: ${PUSH_NOTIFICATIONS_ENABLED:-false}
  FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
  FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
  FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
  TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
  REALTIME_ENABLED: "true"
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_PRETTY: "false"

services:
  postgres:
    image: postgis/postgis:16-3.4
    # Docker Desktop on Apple Silicon uses supported amd64 emulation for this image.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: networkpeer
      POSTGRES_USER: networkpeer_migration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - networkpeer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networkpeer_migration -d networkpeer"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - networkpeer-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      NODE_ENV: development
      DATABASE_MIGRATION_URL: postgresql://networkpeer_migration:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/networkpeer
      NETWORKPEER_APP_DB_PASSWORD: ${NETWORKPEER_APP_DB_PASSWORD:?NETWORKPEER_APP_DB_PASSWORD must be set}
      NETWORKPEER_ADMIN_DB_PASSWORD: ${NETWORKPEER_ADMIN_DB_PASSWORD:?NETWORKPEER_ADMIN_DB_PASSWORD must be set}
      NETWORKPEER_MEDIA_DB_PASSWORD: ${NETWORKPEER_MEDIA_DB_PASSWORD:?NETWORKPEER_MEDIA_DB_PASSWORD must be set}
      NETWORKPEER_FINANCIAL_DB_PASSWORD: ${NETWORKPEER_FINANCIAL_DB_PASSWORD:?NETWORKPEER_FINANCIAL_DB_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      BACKGROUND_QUEUES_ENABLED: "false"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/live').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    command: ["node", "dist/background-worker.js"]
    environment:
      <<: *runtime-environment
      BACKGROUND_QUEUES_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  networkpeer-postgres-data:
  networkpeer-redis-data:
